      case 0:return(<div><SH n={1} title="Executive Summary"/><Sub t="What fundamentally changes"/><ET value={s.execSummary.whatChanges} path={["execSummary","whatChanges"]} multiline/><Sub t="What is at stake"/><ET value={s.execSummary.atStake} path={["execSummary","atStake"]} multiline/><Sub t="Top 5 No-Regret Actions (12–24 months)"/><EL items={s.execSummary.topActions} path={["execSummary","topActions"]}/></div>);
      case 1:return(<div><SH n={2} title="Agentic Customer Vision & Strategic Ambition"/><Sub t="Vision Statement"/><ET value={s.vision.visionStatement} path={["vision","visionStatement"]} multiline/><Sub t={`Strategic Posture: ${s.vision.posture}`}/><ET value={s.vision.postureRationale} path={["vision","postureRationale"]} multiline/><Sub t="Key Disruptive Forces"/><EL items={s.vision.disruptiveForces} path={["vision","disruptiveForces"]}/><Sub t="Agentic Customer Personas"/>{s.vision.personas.map((p,i)=>(<div key={i} style={{...S.card,marginBottom:"12px"}}><div style={{fontWeight:"700",color:"#86BC25",marginBottom:"8px"}}>{p.name}</div>{["goal","triggers","riskTolerance","switching"].map(k=>(<div key={k} style={{display:"flex",gap:"8px",marginBottom:"4px",fontSize:"13px"}}><span style={{color:"#666",minWidth:"120px",flexShrink:0,textTransform:"capitalize"}}>{k.replace(/([A-Z])/g,' $1')}:</span><span style={{color:"#CCCCCC"}}>{p[k]}</span></div>))}</div>))}<Sub t="Delegation Heatmap"/><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:"13px"}}><thead><tr>{["Journey","Agent-Likely","Human-Led","Hybrid"].map(h=><th key={h} style={{padding:"8px 12px",background:"#1E2E15",color:"#86BC25",textAlign:"left",fontWeight:"600"}}>{h}</th>)}</tr></thead><tbody>{s.vision.delegationHeatmap.map((r,i)=>(<tr key={i} style={{borderBottom:"1px solid #1E2E15"}}><td style={{padding:"8px 12px",color:"#CCCCCC"}}>{r.journey}</td><td style={{padding:"8px 12px",color:(r.agentLikely==="High"||r.agentLikely==="Very High")?"#86BC25":"#CCCCCC"}}>{r.agentLikely}</td><td style={{padding:"8px 12px",color:(r.humanLed==="High"||r.humanLed==="Critical")?"#F59E0B":"#CCCCCC"}}>{r.humanLed}</td><td style={{padding:"8px 12px",color:"#CCCCCC"}}>{r.hybrid}</td></tr>))}</tbody></table></div></div>);
      case 2:return(<div><SH n={3} title="Propositions & Experience"/><Sub t="Proposition Exposure Risks"/><EL items={s.propositions.exposureRisks} path={["propositions","exposureRisks"]}/><Sub t="Agent-Ready Design Principles"/><EL items={s.propositions.designPrinciples} path={["propositions","designPrinciples"]}/><Sub t="New / Adapted Agentic Propositions"/>{s.propositions.newPropositions.map((p,i)=>(<div key={i} style={{...S.card,marginBottom:"12px"}}><div style={{fontWeight:"700",color:"#86BC25",marginBottom:"8px"}}>{p.name}</div>{[["persona","Target Persona"],["valueLogic","Value Logic"],["differentiation","Differentiation"],["split","Experience Split"]].map(([k,l])=>(<div key={k} style={{display:"flex",gap:"8px",marginBottom:"4px",fontSize:"13px"}}><span style={{color:"#666",minWidth:"130px",flexShrink:0}}>{l}:</span><span style={{color:"#CCCCCC"}}>{p[k]}</span></div>))}</div>))}</div>);
      case 3:return(<div><SH n={4} title="Channels & Interactions"/><Sub t="Agent-Dominated Interactions"/><EL items={s.channels.agentDominated} path={["channels","agentDominated"]}/><Sub t="Human-Retained Interactions"/><EL items={s.channels.humanRetained} path={["channels","humanRetained"]}/>
        {s.channels.volumeSummary&&s.channels.volumeSummary.grand>0&&(<div style={{marginBottom:"1rem"}}>
          <Sub t="Current Channel & Interaction Volumes"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"12px"}}>
            {[{label:"Digital",val:s.channels.volumeSummary.digital,color:"#86BC25"},{label:"Assisted",val:s.channels.volumeSummary.assisted,color:"#3B82F6"},{label:"In Person",val:s.channels.volumeSummary.inperson,color:"#F59E0B"}].map(b=>(
              <div key={b.label} style={{background:"#0B0F0A",border:`1px solid #1E2E15`,borderRadius:"10px",padding:"10px 14px",borderTop:`3px solid ${b.color}`}}>
                <div style={{fontSize:"10px",fontWeight:"700",color:b.color,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"4px"}}>{b.label}</div>
                <div style={{fontSize:"20px",fontWeight:"800",color:"#FFFFFF",lineHeight:1}}>{b.val.toLocaleString()}</div>
                {s.channels.volumeSummary.grand>0&&<div style={{fontSize:"11px",color:b.color,marginTop:"4px"}}>{((b.val/s.channels.volumeSummary.grand)*100).toFixed(0)}% of total</div>}
              </div>
            ))}
          </div>
          {s.channels.volumeSummary.rows.length>0&&(<div style={{background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"10px",overflow:"hidden"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
              <thead><tr style={{background:"#121A0D"}}>{["Channel","Volume","Unit / Period","Trend","Notes"].map(h=><th key={h} style={{padding:"7px 10px",color:"#86BC25",textAlign:"left",fontWeight:"600",fontSize:"11px"}}>{h}</th>)}</tr></thead>
              <tbody>{s.channels.volumeSummary.rows.map((r,i)=>(<tr key={i} style={{borderBottom:"1px solid #1E2E15"}}><td style={{padding:"7px 10px",color:"#CCCCCC"}}>{r.label}</td><td style={{padding:"7px 10px",color:"#FFFFFF",fontWeight:"700"}}>{r.vol}</td><td style={{padding:"7px 10px",color:"#888"}}>{r.unit||"—"}</td><td style={{padding:"7px 10px",color:r.trend==="▲"?"#86BC25":r.trend==="▼"?"#EF4444":"#888"}}>{r.trend||"—"}</td><td style={{padding:"7px 10px",color:"#666"}}>{r.notes||"—"}</td></tr>))}</tbody>
            </table>
          </div>)}
        </div>)}
        <div style={S.grid2}><div><Sub t="Channels Increasing"/><EL items={s.channels.futureChannelMix.increase} path={["channels","futureChannelMix","increase"]}/></div><div><Sub t="Channels at Risk"/><EL items={s.channels.futureChannelMix.atRisk} path={["channels","futureChannelMix","atRisk"]}/></div></div><Sub t="Priority Channel Investments"/><EL items={s.channels.priorityInvestments} path={["channels","priorityInvestments"]}/></div>);
      case 4:return(<div><SH n={5} title="Operating Model & Capabilities"/><Sub t="New Capabilities Required"/><EL items={s.operatingModel.newCapabilities} path={["operatingModel","newCapabilities"]}/><Sub t="Existing Capabilities Requiring Uplift"/><EL items={s.operatingModel.upliftRequired} path={["operatingModel","upliftRequired"]}/><Sub t="Build Now"/><EL items={s.operatingModel.priorityInvestments.buildNow} path={["operatingModel","priorityInvestments","buildNow"]}/><Sub t="Experiment With"/><EL items={s.operatingModel.priorityInvestments.experiment} path={["operatingModel","priorityInvestments","experiment"]}/><Sub t="Can Wait"/><EL items={s.operatingModel.priorityInvestments.canWait} path={["operatingModel","priorityInvestments","canWait"]}/></div>);
      case 5:{
        // ── Directional shift data — derived from strategy context ──────────
        const client=form.clientName||"Client";
        const ind=form.industry||"";
        // Each metric: label, direction ("up"|"down"|"neutral"), magnitude (1-3), rationale
        const SHIFT_METRICS=[
          {
            group:"Cost Drivers",
            items:[
              {label:"Cost to Serve",dir:"down",mag:3,rationale:"Agent-handled routine interactions reduce human-assisted contact volume significantly",icon:"💰"},
              {label:"Cost of Acquisition",dir:"up",mag:2,rationale:"Agent intermediaries create a new cost layer; brands must invest in agent platform visibility and integration",icon:"📣"},
              {label:"Branch / Physical Costs",dir:"down",mag:2,rationale:"Further reduction in foot traffic as agents resolve queries digitally before customers seek human contact",icon:"🏢"},
              {label:"Technology & API Costs",dir:"up",mag:2,rationale:"Investment in machine-readable infrastructure, API gateways, and real-time decisioning systems",icon:"⚙️"},
              {label:"Compliance & Trust Costs",dir:"up",mag:1,rationale:"New governance requirements around agent-executed transactions, consent frameworks, and audit trails",icon:"📋"},
            ]
          },
          {
            group:"Revenue & Value Drivers",
            items:[
              {label:"Customer Lifetime Value (CLV)",dir:"down",mag:2,rationale:"Agent-driven optimisation increases switching propensity; loyalty economics weaken without proactive retention capability",icon:"📈"},
              {label:"Net Interest / Product Margin",dir:"down",mag:3,rationale:"Agent comparison drives price transparency and rate competition; margin compression across commodity products",icon:"📉"},
              {label:"Cross-sell & Upsell Revenue",dir:"down",mag:2,rationale:"Agents optimising on single decision dimensions reduce organic discovery and relationship-based cross-sell",icon:"🔗"},
              {label:"API & Data Monetisation",dir:"up",mag:2,rationale:"New revenue stream: organisations that expose structured APIs can charge agent platforms for access and integration",icon:"🔌"},
              {label:"Servicing Fee Income",dir:"down",mag:1,rationale:"Automation of queries and transactions reduces fee-generating human touchpoints",icon:"💳"},
              {label:"Retention Rate",dir:"down",mag:2,rationale:"Lower switching friction via agents increases churn risk, particularly for price-sensitive segments",icon:"🔄"},
            ]
          },
          {
            group:"Strategic Value",
            items:[
              {label:"Brand Discoverability",dir:"down",mag:3,rationale:"Without machine-readable data and agent integration, "+client+" risks becoming invisible at the moment of agent-mediated decision",icon:"🔍"},
              {label:"Data Asset Value",dir:"up",mag:2,rationale:"First-party customer data becomes increasingly valuable as agent platforms seek proprietary signals for recommendation",icon:"🗃️"},
              {label:"Customer Relationship Depth",dir:"down",mag:2,rationale:"Direct brand-to-customer engagement declines as agents intermediate; relationship equity at risk without a proactive agentic strategy",icon:"🤝"},
            ]
          }
        ];

        const DirArrow=({dir,mag})=>{
          const color=dir==="up"?"#86BC25":dir==="down"?"#EF4444":"#888";
          const arrows=dir==="up"?"▲".repeat(mag):dir==="down"?"▼".repeat(mag):"→";
          const label=dir==="up"?["","Modest increase","Moderate increase","Significant increase"][mag]:dir==="down"?["","Modest decline","Moderate decline","Significant decline"][mag]:"No material change";
          return(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",minWidth:"80px"}}>
              <div style={{fontSize:mag===3?"20px":mag===2?"17px":"14px",color,letterSpacing:"2px",fontWeight:"700"}}>{arrows}</div>
              <div style={{fontSize:"9px",color,fontWeight:"600",textAlign:"center",lineHeight:"1.2"}}>{label}</div>
            </div>
          );
        };

        // Legend
        const Legend=()=>(
          <div style={{display:"flex",gap:"16px",alignItems:"center",marginBottom:"1rem",flexWrap:"wrap"}}>
            <span style={{fontSize:"11px",color:"#555",fontWeight:"600"}}>DIRECTION KEY:</span>
            {[{sym:"▲▲▲",label:"Significant increase",c:"#86BC25"},{sym:"▲▲",label:"Moderate increase",c:"#86BC25"},{sym:"▲",label:"Modest increase",c:"#86BC25"},{sym:"→",label:"No change",c:"#888"},{sym:"▼",label:"Modest decline",c:"#EF4444"},{sym:"▼▼",label:"Moderate decline",c:"#EF4444"},{sym:"▼▼▼",label:"Significant decline",c:"#EF4444"}].map((l,i)=>(
              <span key={i} style={{display:"flex",alignItems:"center",gap:"5px"}}>
                <span style={{fontSize:"12px",color:l.c,fontWeight:"700"}}>{l.sym}</span>
                <span style={{fontSize:"10px",color:"#555"}}>{l.label}</span>
              </span>
            ))}
          </div>
        );

        return(
          <div>
            <SH n={6} title="Business Model & Value Capture"/>

            {/* Directional shift visualiser */}
            <div style={{marginBottom:"1.5rem"}}>
              <Sub t="Expected Directional Shift — Agentic Economy Impact"/>
              <p style={{fontSize:"12px",color:"#666",marginBottom:"1rem",lineHeight:"1.5"}}>Indicative directional impact on {client}'s key cost and revenue drivers as agentic customer behaviour matures. Magnitude reflects expected scale of shift under medium adoption scenario.</p>
              <Legend/>
              {SHIFT_METRICS.map((group,gi)=>(
                <div key={gi} style={{marginBottom:"1rem"}}>
                  <div style={{fontSize:"10px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.6px",padding:"8px 12px",background:"rgba(134,188,37,0.06)",borderRadius:"8px 8px 0 0",borderBottom:"1px solid #1E2E15",border:"1px solid #1E2E15"}}>{group.group}</div>
                  <div style={{border:"1px solid #1E2E15",borderTop:"none",borderRadius:"0 0 8px 8px",overflow:"hidden"}}>
                    {group.items.map((m,mi)=>(
                      <div key={mi} style={{display:"grid",gridTemplateColumns:"28px 1fr 100px",alignItems:"center",gap:"12px",padding:"10px 14px",borderBottom:mi<group.items.length-1?"1px solid #0F1E0C":"none",background:mi%2===0?"transparent":"rgba(0,0,0,0.12)"}}>
                        <span style={{fontSize:"16px",textAlign:"center"}}>{m.icon}</span>
                        <div>
                          <div style={{fontSize:"13px",fontWeight:"600",color:"#FFFFFF",marginBottom:"2px"}}>{m.label}</div>
                          <div style={{fontSize:"11px",color:"#666",lineHeight:"1.4"}}>{m.rationale}</div>
                        </div>
                        <DirArrow dir={m.dir} mag={m.mag}/>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <Sub t="Value at Risk"/>
            <EL items={s.valueCapture.valueAtRisk} path={["valueCapture","valueAtRisk"]}/>
            <Sub t="Agentic Value Opportunities"/>
            <EL items={s.valueCapture.opportunities} path={["valueCapture","opportunities"]}/>
            <Sub t="Scenario View"/>
            {["low","medium","high"].map(sc=>(<div key={sc} style={{...S.card,marginBottom:"12px"}}><div style={{fontWeight:"700",color:sc==="high"?"#86BC25":sc==="medium"?"#F59E0B":"#CCCCCC",marginBottom:"6px",textTransform:"capitalize"}}>{sc} Adoption Scenario</div><ET value={s.valueCapture.scenarios[sc]} path={["valueCapture","scenarios",sc]} multiline/></div>))}
            <Sub t="Strategic Business Model Choice"/>
            <ET value={s.valueCapture.businessModelChoice} path={["valueCapture","businessModelChoice"]} multiline/>
          </div>
        );
      }
      case 6:return(<div><SH n={7} title="Integrated Roadmap"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"12px",marginTop:"12px"}}>{[{k:"now",l:"NOW",sub:"0–3 months",c:"#86BC25"},{k:"next",l:"NEXT",sub:"3–12 months",c:"#F59E0B"},{k:"later",l:"LATER",sub:"12–24 months",c:"#3B82F6"}].map(({k,l,sub,c})=>(<div key={k} style={{...S.card,borderTop:`3px solid ${c}`}}><div style={{fontWeight:"800",color:c,fontSize:"13px",marginBottom:"2px"}}>{l}</div><div style={{fontSize:"11px",color:"#555",marginBottom:"12px"}}>{sub}</div><EL items={s.roadmap[k]} path={["roadmap",k]}/></div>))}</div></div>);
      case 7:return(<div><SH n={8} title="Assumptions, Risks & Open Questions"/><Sub t="Key Assumptions"/><EL items={s.assumptions.assumptions} path={["assumptions","assumptions"]}/><Sub t="Risks to Monitor"/><EL items={s.assumptions.risks} path={["assumptions","risks"]}/><Sub t="Open Questions"/><EL items={s.assumptions.openQuestions} path={["assumptions","openQuestions"]}/></div>);
      case 8:return(<div><SH n={9} title="Workshop & Sprint Prompts"/><p style={{color:"#888",fontSize:"13px",marginBottom:"12px"}}>Key questions to validate and deepen the strategy with executives</p><EL items={s.workshopPrompts} path={["workshopPrompts"]}/></div>);
      case 9:{
        let vis=null;
        try{vis=s.visibilityAssessment?JSON.parse(s.visibilityAssessment):null;}catch{}
        if(!vis)return(<div><SH n={10} title="Agent Visibility Assessment"/><div style={{...S.card,textAlign:"center",padding:"2rem"}}><div style={{fontSize:"32px",marginBottom:"12px"}}>🔍</div><p style={{color:"#888",fontSize:"14px"}}>No assessment has been run yet. Complete Step 8 — Agent Visibility Assessment — and run the AI analysis to generate this section.</p></div></div>);
        const RCOLS={Critical:"#EF4444",High:"#F97316",Medium:"#F59E0B",Low:"#86BC25"};
        return(<div>
          <SH n={10} title="Agent Visibility Assessment"/>
          <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"1rem"}}>
            <div style={{width:"52px",height:"52px",borderRadius:"50%",background:vis.agentReadinessScore>=70?"#1E3A0A":vis.agentReadinessScore>=45?"#3A2A0A":"#3A0A0A",border:`2px solid ${vis.agentReadinessScore>=70?"#86BC25":vis.agentReadinessScore>=45?"#F59E0B":"#EF4444"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",fontWeight:"800",color:vis.agentReadinessScore>=70?"#86BC25":vis.agentReadinessScore>=45?"#F59E0B":"#EF4444",flexShrink:0}}>{vis.agentReadinessScore}</div>
            <div><div style={{fontSize:"14px",fontWeight:"700",color:"#FFFFFF"}}>Agent Readiness Score</div><div style={{fontSize:"12px",color:"#666"}}>out of 100 · Generated by Claude</div></div>
          </div>
          <Sub t="Overall Position"/>
          <p style={{fontSize:"14px",color:"#CCCCCC",lineHeight:"1.7",marginBottom:"1rem"}}>{vis.overallRating}</p>
          <Sub t="Relative Strengths"/>
          <div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginBottom:"1rem"}}>{(vis.strengthAreas||[]).map((s,i)=><span key={i} style={{background:"rgba(134,188,37,0.1)",border:"1px solid rgba(134,188,37,0.3)",borderRadius:"8px",padding:"5px 12px",fontSize:"12px",color:"#86BC25"}}>{s}</span>)}</div>
          <Sub t="Critical Data Gaps"/>
          {(vis.criticalGaps||[]).map((g,i)=>(
            <div key={i} style={{background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"10px",padding:"12px 14px",marginBottom:"8px",borderLeft:`3px solid ${RCOLS[g.urgency]||"#F59E0B"}`}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}}><span style={{fontSize:"13px",fontWeight:"700",color:"#FFFFFF"}}>{g.category}</span><span style={{fontSize:"10px",fontWeight:"700",color:RCOLS[g.urgency]||"#F59E0B"}}>{g.urgency}</span></div>
              <p style={{margin:"0 0 4px",fontSize:"13px",color:"#CCCCCC",lineHeight:"1.5"}}>{g.issue}</p>
              <p style={{margin:0,fontSize:"12px",color:"#888"}}><span style={{color:"#F59E0B"}}>Agent impact: </span>{g.agentImpact}</p>
            </div>
          ))}
          <Sub t="Invisibility Risks vs Competitors"/>
          {(vis.invisibilityRisks||[]).map((r,i)=>(
            <div key={i} style={{background:"#0B0F0A",border:`1px solid ${RCOLS[r.riskLevel]||"#EF4444"}30`,borderRadius:"12px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"8px"}}>
                <div style={{fontSize:"14px",fontWeight:"700",color:"#FFFFFF",paddingRight:"10px"}}>"{r.scenario}"</div>
                <span style={{fontSize:"10px",fontWeight:"700",color:RCOLS[r.riskLevel]||"#EF4444",whiteSpace:"nowrap",flexShrink:0}}>{r.riskLevel} RISK</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"8px"}}>
                <div><div style={{fontSize:"10px",fontWeight:"700",color:"#EF4444",marginBottom:"3px"}}>WHY INVISIBLE</div><p style={{margin:0,fontSize:"12px",color:"#CCCCCC",lineHeight:"1.5"}}>{r.whyInvisible}</p></div>
                <div><div style={{fontSize:"10px",fontWeight:"700",color:"#F59E0B",marginBottom:"3px"}}>COMPETITOR ADVANTAGE</div><p style={{margin:0,fontSize:"12px",color:"#CCCCCC",lineHeight:"1.5"}}>{r.competitorAdvantage}</p></div>
              </div>
              <div style={{borderTop:"1px solid #1E2E15",paddingTop:"8px"}}><span style={{fontSize:"11px",color:"#555"}}>Value at risk: </span><span style={{fontSize:"12px",color:"#888"}}>{r.valueAtRisk}</span></div>
            </div>
          ))}
          <Sub t="Quick Wins (0–90 days)"/>
          <ol style={{paddingLeft:"18px",margin:"0 0 1rem"}}>{(vis.quickWins||[]).map((w,i)=><li key={i} style={{fontSize:"13px",color:"#CCCCCC",lineHeight:"1.6",marginBottom:"6px"}}>{w}</li>)}</ol>
          <Sub t="Strategic Imperative"/>
          <div style={{background:"rgba(134,188,37,0.05)",border:"1px solid rgba(134,188,37,0.25)",borderRadius:"12px",padding:"14px 16px"}}><p style={{margin:0,fontSize:"14px",color:"#FFFFFF",lineHeight:"1.7",fontStyle:"italic"}}>{vis.strategicImperative}</p></div>
        </div>);
      }
      default:return null;
    }
  };
  const exportBtnStyle={border:"none",borderRadius:"10px",padding:"7px 14px",fontSize:"12px",fontWeight:"700"};
  return(
    <div style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"stretch"}}>
      <div style={{display:"flex",width:"100%",height:"100%",background:"#0B0F0A"}}>
        <div style={{width:"220px",flexShrink:0,background:"#121A0D",borderRight:"1px solid #1E2E15",padding:"1.5rem 0",overflowY:"auto"}}>
          <div style={{padding:"0 1rem 1rem",fontSize:"13px",fontWeight:"700",color:"#86BC25",letterSpacing:"0.5px"}}>STRATEGY SECTIONS</div>
          {sections.map((sec,i)=>(<button key={i} onClick={()=>setActiveSection(i)} style={{display:"block",width:"100%",textAlign:"left",padding:"10px 1rem",fontSize:"12px",background:activeSection===i?"rgba(134,188,37,0.1)":"transparent",color:activeSection===i?"#86BC25":"#888",border:"none",borderLeft:activeSection===i?"3px solid #86BC25":"3px solid transparent",cursor:"pointer",lineHeight:"1.4"}}><span style={{color:"#444",marginRight:"6px"}}>0{i+1}</span>{sec}</button>))}
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"1rem 1.5rem",background:"#121A0D",borderBottom:"1px solid #1E2E15",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div><div style={{fontWeight:"700",fontSize:"16px"}}>Strategy Preview</div><div style={{fontSize:"12px",color:"#666"}}>{form.clientName||"Client"} · Agentic Customer Strategy</div></div>
            <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
              <button onClick={()=>setEditMode(!editMode)} style={{...S.btnGhost,fontSize:"12px",padding:"7px 14px"}}>{editMode?"✓ Done Editing":"✏ Edit"}</button>
              <ExportButton label="⬇ Word (.docx)" onExport={()=>onExport(edited,"docx")} btnStyle={{...exportBtnStyle,background:"#1F5FAD",color:"#FFFFFF"}}/>
              <ExportButton label="⬇ PowerPoint (.pptx)" onExport={()=>onExport(edited,"pptx")} btnStyle={{...exportBtnStyle,background:"#C43E1C",color:"#FFFFFF"}}/>
              <button onClick={onClose} style={{...S.btnSecondary,padding:"7px 12px",fontSize:"16px"}}>×</button>
            </div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"1.5rem 2rem"}}>{renderSection(activeSection)}</div>
          <div style={{padding:"1rem 1.5rem",background:"#121A0D",borderTop:"1px solid #1E2E15",display:"flex",justifyContent:"space-between",flexShrink:0}}>
            <button onClick={()=>setActiveSection(Math.max(0,activeSection-1))} disabled={activeSection===0} style={{...S.btnSecondary,opacity:activeSection===0?0.4:1}}>← Previous</button>
            <span style={{fontSize:"12px",color:"#666",alignSelf:"center"}}>Section {activeSection+1} of {sections.length}</span>
            <button onClick={()=>setActiveSection(Math.min(sections.length-1,activeSection+1))} disabled={activeSection===sections.length-1} style={{...S.btnPrimary,opacity:activeSection===sections.length-1?0.4:1}}>Next →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── SETTINGS MODAL ────────────────────────────────────────────────────────────
function SettingsModal({teammateName,apiKey,onSave,onClose}){
  const[name,setName]=useState(teammateName);
  const[key,setKey]=useState(apiKey||"");
  return(<div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{...S.card,width:"440px",padding:"2rem"}}><h3 style={{margin:"0 0 1.25rem",fontSize:"16px"}}>Settings</h3><Field label="Teammate Name" hint="This name is used in the landing page greeting"><input style={S.input} value={name} onChange={e=>setName(e.target.value)}/></Field><Field label="Anthropic API Key" hint="Required to extract content from uploaded documents and run agent visibility assessments"><input style={{...S.input,fontFamily:"monospace",letterSpacing:"0.5px"}} type="password" value={key} placeholder="sk-ant-…" onChange={e=>setKey(e.target.value)}/></Field><p style={{fontSize:"11px",color:"#444",margin:"-12px 0 1rem",lineHeight:"1.5"}}>Your key is stored in your browser only and sent directly to Anthropic — never to any other server.</p><div style={{display:"flex",gap:"12px",marginTop:"1.5rem"}}><button onClick={()=>onSave(name,key)} style={S.btnPrimary}>Save</button><button onClick={onClose} style={S.btnSecondary}>Cancel</button></div></div></div>);
}

// ── DEFAULT LANDING COPY ───────────────────────────────────────────────────────
const DEFAULT_LANDING={
  badge:"Agentic Customer Strategy",
  headline:"I'm here to help you think through customer strategy.",
  subtext:"I can help you organise inputs, structure discovery, and shape an early strategy deliverable you can build on and take forward to the team and the client.",
  ctaLabel:"Get Started →",
  cards:[
    {icon:"🧭",title:"Guided, but flexible",desc:"I can help you structure the work without forcing a one-size-fits-all approach. I'll prompt for the inputs that matter, when they're useful."},
    {icon:"✍️",title:"Synthesis when you need it",desc:"When you're ready, I can help draft a clear strategy narrative you can review, edit, and export to Word or PowerPoint."},
    {icon:"🤝",title:"Built to support your thinking",desc:"You are in control — let me take care of structure and synthesis, so you can focus on insight and client conversations."},
  ],
};

// ── LANDING PAGE ──────────────────────────────────────────────────────────────
function LandingPage({onStart,teammateName,visitorName}){
  const[editing,setEditing]=useState(false);
  const[copy,setCopy]=useState(()=>{
    try{const s=localStorage.getItem("asa_landing_copy");return s?JSON.parse(s):DEFAULT_LANDING;}catch{return DEFAULT_LANDING;}
  });
  const[draft,setDraft]=useState(copy);

  const saveCopy=()=>{
    setCopy(draft);
    localStorage.setItem("asa_landing_copy",JSON.stringify(draft));
    setEditing(false);
  };
  const cancelEdit=()=>{setDraft(copy);setEditing(false);};
  const resetDefaults=()=>{setDraft(DEFAULT_LANDING);};
  const updDraft=(path,val)=>{
    setDraft(prev=>{
      const next=JSON.parse(JSON.stringify(prev));
      let obj=next;
      for(let i=0;i<path.length-1;i++)obj=obj[path[i]];
      obj[path[path.length-1]]=val;
      return next;
    });
  };

  const d=editing?draft:copy;

  const editInp=(val,path,big)=>editing?(
    big
      ?<textarea style={{...S.textarea,marginBottom:0,minHeight:"60px",fontSize:"inherit",lineHeight:"inherit",fontWeight:"inherit"}} value={val} onChange={e=>updDraft(path,e.target.value)}/>
      :<input style={{...S.input,marginBottom:0,fontSize:"inherit",fontWeight:"inherit",textAlign:"center"}} value={val} onChange={e=>updDraft(path,e.target.value)}/>
  ):null;

  const EditOverlay=({children,val,path,big,style:st})=>editing?(
    <div style={{position:"relative",...st}}>
      {big
        ?<textarea style={{...S.textarea,minHeight:"60px",width:"100%",fontSize:"inherit",lineHeight:"inherit",fontWeight:"inherit",textAlign:"inherit"}} value={val} onChange={e=>updDraft(path,e.target.value)}/>
        :<input style={{...S.input,fontSize:"inherit",fontWeight:"inherit",textAlign:"center",width:"100%"}} value={val} onChange={e=>updDraft(path,e.target.value)}/>}
    </div>
  ):<>{children}</>;

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"4rem 2rem",textAlign:"center",position:"relative"}}>

      {/* Edit toolbar */}
      <div style={{position:"absolute",top:"16px",right:"16px",display:"flex",gap:"8px",alignItems:"center",zIndex:10}}>
        {editing?(
          <>
            <button onClick={resetDefaults} style={{...S.btnSecondary,fontSize:"11px",padding:"5px 12px",color:"#888"}}>Reset defaults</button>
            <button onClick={cancelEdit} style={{...S.btnSecondary,fontSize:"11px",padding:"5px 12px"}}>Cancel</button>
            <button onClick={saveCopy} style={{...S.btnPrimary,fontSize:"11px",padding:"5px 14px"}}>✓ Save</button>
          </>
        ):(
          <button onClick={()=>{setDraft(copy);setEditing(true);}} style={{...S.btnGhost,fontSize:"11px",padding:"5px 14px",display:"flex",alignItems:"center",gap:"6px"}}>
            <span>✏</span><span>Edit page</span>
          </button>
        )}
      </div>

      <div style={{maxWidth:"680px",width:"100%"}}>
        {/* Badge */}
        {editing
          ?<div style={{marginBottom:"1.5rem"}}>
              <input style={{...S.input,display:"inline-block",width:"auto",textAlign:"center",fontSize:"12px",fontWeight:"600",letterSpacing:"1px",color:"#86BC25",background:"rgba(134,188,37,0.1)",border:"1px solid rgba(134,188,37,0.3)",borderRadius:"20px",padding:"5px 16px"}} value={d.badge} onChange={e=>updDraft(["badge"],e.target.value)}/>
           </div>
          :<div style={{display:"inline-block",background:"rgba(134,188,37,0.1)",border:"1px solid rgba(134,188,37,0.3)",borderRadius:"20px",padding:"6px 16px",fontSize:"12px",color:"#86BC25",fontWeight:"600",letterSpacing:"1px",marginBottom:"2rem",textTransform:"uppercase"}}>{d.badge}</div>
        }

        {/* Headline */}
        {editing
          ?<div style={{marginBottom:"1.25rem"}}>
              <textarea style={{...S.textarea,fontSize:"32px",fontWeight:"800",lineHeight:"1.15",letterSpacing:"-1px",textAlign:"center",minHeight:"120px",color:"#FFFFFF"}} value={d.headline} onChange={e=>updDraft(["headline"],e.target.value)}/>
           </div>
          :<h1 style={{fontSize:"clamp(28px,4vw,48px)",fontWeight:"800",lineHeight:"1.1",margin:"0 0 1.5rem",letterSpacing:"-1.5px"}}>
              Hi <span style={{color:"#86BC25"}}>{visitorName||teammateName}</span>, {d.headline}
           </h1>
        }

        {/* Subtext */}
        {editing
          ?<div style={{marginBottom:"2rem"}}>
              <textarea style={{...S.textarea,fontSize:"16px",lineHeight:"1.7",color:"#CCCCCC",textAlign:"center",minHeight:"80px"}} value={d.subtext} onChange={e=>updDraft(["subtext"],e.target.value)}/>
           </div>
          :<p style={{fontSize:"18px",color:"#CCCCCC",lineHeight:"1.7",margin:"0 0 2.5rem",fontWeight:"400"}}>{d.subtext}</p>
        }

        {/* CTA button */}
        {editing
          ?<div style={{marginBottom:"1rem"}}>
              <input style={{...S.input,width:"auto",textAlign:"center",fontSize:"14px",fontWeight:"700",background:"#86BC25",color:"#0B0F0A",border:"none",borderRadius:"10px",padding:"10px 28px"}} value={d.ctaLabel} onChange={e=>updDraft(["ctaLabel"],e.target.value)}/>
              <div style={{fontSize:"11px",color:"#555",marginTop:"6px"}}>↑ editing button label — click below to test navigation</div>
           </div>
          :<button onClick={onStart} style={{...S.btnPrimary,fontSize:"16px",padding:"14px 40px",borderRadius:"12px"}}>{d.ctaLabel}</button>
        }
      </div>

      {/* Feature cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"20px",maxWidth:"860px",width:"100%",marginTop:"4rem",textAlign:"left"}}>
        {d.cards.map((c,i)=>(
          <div key={i} style={{...S.card,outline:editing?"1px dashed #2A3E20":"none",position:"relative"}}>
            {editing?(
              <div>
                <div style={{marginBottom:"10px"}}>
                  <input style={{...S.input,fontSize:"22px",padding:"4px 8px",marginBottom:"6px"}} value={c.icon} onChange={e=>updDraft(["cards",i,"icon"],e.target.value)} placeholder="Emoji"/>
                  <input style={{...S.input,fontSize:"14px",fontWeight:"700",color:"#FFFFFF"}} value={c.title} onChange={e=>updDraft(["cards",i,"title"],e.target.value)} placeholder="Card title"/>
                </div>
                <textarea style={{...S.textarea,fontSize:"13px",color:"#888",minHeight:"80px"}} value={c.desc} onChange={e=>updDraft(["cards",i,"desc"],e.target.value)} placeholder="Card description"/>
              </div>
            ):(
              <>
                <div style={{fontSize:"28px",marginBottom:"12px"}}>{c.icon}</div>
                <h3 style={{fontSize:"15px",fontWeight:"700",margin:"0 0 8px",color:"#FFFFFF"}}>{c.title}</h3>
                <p style={{fontSize:"13px",color:"#888",lineHeight:"1.6",margin:0}}>{c.desc}</p>
              </>
            )}
          </div>
        ))}
      </div>

      {editing&&(
        <div style={{marginTop:"2rem",display:"flex",gap:"12px"}}>
          <button onClick={saveCopy} style={{...S.btnPrimary,padding:"10px 28px"}}>✓ Save changes</button>
          <button onClick={cancelEdit} style={S.btnSecondary}>Cancel</button>
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[page,setPage]=useState("landing");
  const[step,setStep]=useState(1);
  const[form,setForm]=useState(()=>{try{return{...INITIAL_FORM,...(JSON.parse(localStorage.getItem("asa_form")||"{}"))}}catch{return INITIAL_FORM}});
  const[teammateName,setTeammateName]=useState(()=>localStorage.getItem("asa_teammate")||"Sarah"); const[visitorName,setVisitorName]=useState(()=>localStorage.getItem("asa_visitor_name")||"");
  const[showSettings,setShowSettings]=useState(false);
  const[showPreview,setShowPreview]=useState(false);
  const[strategy,setStrategy]=useState(null);
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem("asa_api_key")||"");
  const[docHints,setDocHints]=useState({});

  useEffect(()=>{const s=localStorage.getItem("asa_step");const p=localStorage.getItem("asa_page");if(s)setStep(Number(s));if(p)setPage(p);},[]);
  useEffect(()=>{localStorage.setItem("asa_form",JSON.stringify(form));},[form]);
  useEffect(()=>{localStorage.setItem("asa_step",step);},[step]);
  useEffect(()=>{localStorage.setItem("asa_page",page);},[page]);

  const update=useCallback((key,val)=>{
    setForm(prev=>({...prev,[key]:val}));
    if(val)setDocHints(prev=>{if(!prev[key])return prev;const n={...prev};delete n[key];return n;});
  },[]);

  const updateIfEmpty=useCallback((key,val)=>{
    setForm(prev=>prev[key]?prev:{...prev,[key]:val});
  },[]);

  const handleDocProcessed=useCallback((emptyFields)=>{
    setDocHints(prev=>({...prev,...emptyFields}));
  },[]);

  const handleExport=async(editedStrategy,type)=>{
    if(type==="docx")await exportToDocx(editedStrategy,form);
    else await exportToPptx(editedStrategy,form);
  };

  const handleGeneratePreview=()=>{setStrategy(buildStrategyContent(form));setShowPreview(true);};

  const renderStep=()=>{
    if(step===1)return<Step1 form={form} update={update}/>;
    if(step===4)return<Step4 form={form} update={update}/>;
    if(step===7)return<Step7 form={form} update={update}/>;
    if(step===8)return<Step8 form={form} update={update}/>;
    const fields=STEP_FIELDS[step];
    return<StepGeneric fields={fields} form={form} update={update} sectionId={`step${step}`}/>;
  };

  const currentStepData=STEPS[step-1];

  return(
    <DocHintsCtx.Provider value={docHints}>
    <DocUploadCtx.Provider value={{apiKey,updateIfEmpty,onDocProcessed:handleDocProcessed}}>
    <div style={S.app}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}} input:focus,textarea:focus,select:focus{border-color:#86BC25!important;} button:hover{opacity:0.88;}`}</style>
      <nav style={S.nav}>
        <div style={S.navLogo}>
          <div style={{width:"28px",height:"28px",background:"#86BC25",borderRadius:"6px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px"}}>⚡</div>
          <span><span style={{color:"#86BC25"}}>Agentic</span> Strategy Agent</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
          {page==="wizard"&&(<><button onClick={handleGeneratePreview} style={S.btnGhost}>Preview Strategy ↗</button><button onClick={()=>{setPage("landing");localStorage.setItem("asa_page","landing");}} style={{...S.btnSecondary,padding:"8px 16px",fontSize:"13px"}}>← Home</button></>)}
          <button onClick={()=>setShowSettings(true)} style={{...S.btnSecondary,padding:"8px 12px",fontSize:"16px"}}>⚙</button>
        </div>
      </nav>

      {page==="landing"
        ?<LandingPage teammateName={teammateName} visitorName={visitorName} onStart={()=>{setPage("wizard");localStorage.setItem("asa_page","wizard");}}/>
        :(
          <div style={{flex:1,display:"flex"}}>
            <div style={{width:"210px",flexShrink:0,background:"#121A0D",borderRight:"1px solid #1E2E15",display:"flex",flexDirection:"column"}}>
              <div style={{padding:".75rem 1rem .5rem",fontSize:"10px",fontWeight:"700",color:"#444",letterSpacing:".6px",textTransform:"uppercase"}}>Discovery Modules</div>
              {STEPS.map(s=>(
                <button key={s.id} onClick={()=>setStep(s.id)} style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"9px 1rem",textAlign:"left",background:step===s.id?"rgba(134,188,37,0.1)":"transparent",border:"none",borderLeft:step===s.id?"3px solid #86BC25":"3px solid transparent",color:step===s.id?"#fff":"#555",fontSize:"12px",cursor:"pointer"}}>
                  <div style={{width:"26px",height:"26px",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:"700",flexShrink:0,background:step===s.id?"#86BC25":step>s.id?"#1E3A0A":"#0B0F0A",border:step===s.id||step>s.id?"2px solid #86BC25":"2px solid #1E2E15",color:step===s.id?"#0B0F0A":step>s.id?"#86BC25":"#444"}}>{step>s.id?"✓":s.id}</div>
                  {s.label}
                </button>
              ))}
              <div style={{padding:"1rem",marginTop:"auto"}}><button onClick={handleGeneratePreview} style={{...S.btnPrimary,width:"100%",fontSize:"12px"}}>Export Strategy Deck ↗</button></div>
            </div>
            <div style={{flex:1,padding:"1.5rem",overflowY:"auto",maxWidth:"960px"}}>
              <div style={{marginBottom:"1.25rem"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"8px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                    <span style={{fontSize:"22px"}}>{currentStepData.icon}</span>
                    <div>
                      <div style={{fontSize:"10px",color:"#444",fontWeight:"700",letterSpacing:".5px",textTransform:"uppercase"}}>Step {step} of {STEPS.length}</div>
                      <div style={{fontSize:"20px",fontWeight:"800",letterSpacing:"-.5px"}}>{currentStepData.label}</div>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:"8px"}}>
                    {step>1&&<button onClick={()=>setStep(step-1)} style={S.btnSecondary}>← Back</button>}
                    {step<STEPS.length&&<button onClick={()=>setStep(step+1)} style={S.btnPrimary}>Next →</button>}
                  </div>
                </div>
                <div style={{height:"4px",background:"#1E2E15",borderRadius:"2px"}}><div style={{height:"100%",width:`${(step/STEPS.length)*100}%`,background:"#86BC25",borderRadius:"2px",transition:"width 0.4s"}}/></div>
              </div>
              <div style={{...S.cardGlow,marginBottom:"1.5rem"}}>{renderStep()}</div>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <button onClick={()=>step>1&&setStep(step-1)} disabled={step===1} style={{...S.btnSecondary,opacity:step===1?0.4:1}}>← Back</button>
                {step<STEPS.length?<button onClick={()=>setStep(step+1)} style={S.btnPrimary}>Continue to {STEPS[step]?.label} →</button>:<button onClick={handleGeneratePreview} style={S.btnPrimary}>Generate Strategy ↗</button>}
              </div>
            </div>
          </div>
        )
      }

      {showSettings&&<SettingsModal teammateName={teammateName} apiKey={apiKey} onSave={(tName,k)=>{setTeammateName(tName);localStorage.setItem("asa_teammate",tName);setApiKey(k);localStorage.setItem("asa_api_key",k);setShowSettings(false);}} onClose={()=>setShowSettings(false)}/>}
      {showPreview&&strategy&&<PreviewModal strategy={strategy} form={form} onClose={()=>setShowPreview(false)} onExport={handleExport}/>}
    </div>
    </DocUploadCtx.Provider>
    </DocHintsCtx.Provider>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
