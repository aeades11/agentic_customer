function FileDrop(){
  const{apiKey,updateIfEmpty,onDocProcessed}=React.useContext(DocUploadCtx);
  const[dragging,setDragging]=useState(false);
  const[files,setFiles]=useState([]);
  const[processing,setProcessing]=useState(false);
  const[status,setStatus]=useState(null);
  const ref=useRef();

  const extractText=async(file)=>{
    const name=file.name.toLowerCase();
    if(name.endsWith('.txt')||name.endsWith('.md')||name.endsWith('.csv')){
      return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.onerror=rej;fr.readAsText(file);});
    }
    if(name.endsWith('.pdf')){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const ab=await file.arrayBuffer();
      const pdf=await window.pdfjsLib.getDocument({data:ab}).promise;
      let text='';
      for(let i=1;i<=Math.min(pdf.numPages,30);i++){const page=await pdf.getPage(i);const content=await page.getTextContent();text+=content.items.map(s=>s.str).join(' ')+'\n';}
      return text;
    }
    if(name.endsWith('.docx')){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      const ab=await file.arrayBuffer();
      const zip=await window.JSZip.loadAsync(ab);
      const xml=await zip.file('word/document.xml').async('text');
      return xml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    }
    throw new Error('Unsupported file type. Use .txt, .md, .pdf, or .docx.');
  };

  const processFile=async(file)=>{
    setProcessing(true);setStatus(null);
    try{
      const text=await extractText(file);
      if(!text||text.trim().length<30){setStatus({type:'error',msg:`Could not extract readable text from ${file.name}.`});setProcessing(false);return;}
      const prompt=`You are helping a strategy consultant extract information from a supporting document to pre-fill a customer strategy analysis form.\n\nDocument content:\n---\n${text.slice(0,8000)}\n---\n\nExtract information relevant to each field below. Return ONLY a valid JSON object — no markdown, no preamble, no trailing text. For each field, provide a concise extracted value if clearly relevant content exists in the document, or an empty string "" if no relevant content is found. Only include content directly supported by the document.\n\n${JSON.stringify(DOC_FIELD_DESCRIPTIONS)}`;
      const hdrs={"Content-Type":"application/json"};
      const key=apiKey||localStorage.getItem("asa_api_key")||"";
      if(key)hdrs["x-api-key"]=key;
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:hdrs,body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||"API error");
      const raw=data.content?.find(b=>b.type==="text")?.text||"";
      const extracted=JSON.parse(raw.replace(/```json|```/g,"").trim());
      let filled=0;const empty={};
      Object.entries(extracted).forEach(([k,v])=>{
        if(v&&v.trim()){updateIfEmpty(k,v.trim());filled++;}
        else{empty[k]=true;}
      });
      setFiles(p=>[...p,file.name]);
      setStatus({type:'success',msg:`${filled} field${filled===1?'':'s'} pre-filled from ${file.name}.${filled===0?' The document may not contain enough relevant strategy content.':''}`});
      if(onDocProcessed)onDocProcessed(empty);
    }catch(e){
      console.error(e);
      setStatus({type:'error',msg:`Could not process ${file.name}. ${e.message||'Add your API key in Settings (⚙) to enable document extraction.'}`});
    }
    setProcessing(false);
  };

  const handleFiles=(fileList)=>{Array.from(fileList).forEach(f=>processFile(f));};

  return(
    <div style={{marginTop:"1rem"}}>
      <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
        onDrop={e=>{e.preventDefault();setDragging(false);handleFiles(e.dataTransfer.files);}}
        onClick={()=>!processing&&ref.current?.click()}
        style={{border:`1.5px dashed ${dragging?"#86BC25":"#2A3E20"}`,borderRadius:"10px",padding:"16px",textAlign:"center",cursor:processing?"default":"pointer",background:dragging?"rgba(134,188,37,0.05)":"transparent"}}>
        {processing
          ?<><div style={{display:"inline-block",width:"14px",height:"14px",border:"2px solid rgba(134,188,37,0.3)",borderTopColor:"#86BC25",borderRadius:"50%",animation:"spin 0.7s linear infinite",marginBottom:"6px",verticalAlign:"middle"}}/><span style={{fontSize:"12px",color:"#86BC25",marginLeft:"8px"}}>Reading and extracting from document…</span></>
          :<><div style={{fontSize:"20px",marginBottom:"4px"}}>📎</div>
            <p style={{fontSize:"12px",color:"#666",margin:0}}>Drag & drop supporting documents, or <span style={{color:"#86BC25"}}>browse</span></p>
            <p style={{fontSize:"11px",color:"#444",margin:"4px 0 0"}}>Supports .txt, .md, .pdf, .docx · Relevant fields will be pre-filled automatically</p></>
        }
        {files.length>0&&<div style={{marginTop:"8px"}}>{files.map((f,i)=><span key={i} style={{fontSize:"11px",color:"#86BC25",background:"rgba(134,188,37,0.1)",borderRadius:"6px",padding:"2px 8px",marginRight:"4px"}}>✓ {f}</span>)}</div>}
      </div>
      {status&&<p style={{fontSize:"12px",color:status.type==='success'?"#86BC25":"#EF4444",marginTop:"6px"}}>{status.type==='success'?"✓ ":"⚠ "}{status.msg}</p>}
      <input ref={ref} type="file" multiple accept=".txt,.md,.csv,.pdf,.docx" style={{display:"none"}} onChange={e=>{handleFiles(e.target.files);e.target.value="";}}/>
    </div>
  );
}

function Step1({form,update}){
  const handleClientName=val=>{
    update("clientName",val);
    const m=BRAND_MAP[val];
    if(m){
      if(!form.industry)update("industry",m.industry);
      if(!form.geography)update("geography",m.geo);
      if(!form.brandPositioning)update("brandPositioning",m.positioning);
      if(!form.competitiveSet)update("competitiveSet",m.competitive);
    }
  };
  return(
    <div>
      <div style={{...S.card,marginBottom:"1.25rem",background:"rgba(134,188,37,0.05)",border:"1px solid rgba(134,188,37,0.2)"}}>
        <p style={{margin:0,fontSize:"14px",color:"#CCCCCC",lineHeight:"1.6"}}>Provide organisational context including who the client is, where they operate, and how they compete.</p>
      </div>
      <div style={S.grid2}>
        <Field label="Client Name" hint="Enter the organisation or brand name you are working with" fieldKey="clientName">
          <input style={S.input} value={form.clientName} placeholder="e.g. Westpac, Telstra, Qantas" onChange={e=>handleClientName(e.target.value)} list="brand-suggestions"/>
          <datalist id="brand-suggestions">{Object.keys(BRAND_MAP).map(b=><option key={b} value={b}/>)}</datalist>
        </Field>
        <Field label="Client Type" hint="Select the closest category for this client"><ClientTypeSelector value={form.clientType} onChange={v=>update("clientType",v)}/></Field>
      </div>
      <div style={S.grid2}>
        <Field label="Industry / Category" hint="Select the primary industry this organisation operates in" fieldKey="industry">
          <select style={S.select} value={form.industry} onChange={e=>update("industry",e.target.value)}>
            <option value="">Select industry…</option>{INDUSTRIES.map(i=><option key={i} value={i}>{i}</option>)}
          </select>
        </Field>
        <Field label="Geography" hint="Select the primary geography or market" fieldKey="geography">
          <select style={S.select} value={form.geography} onChange={e=>update("geography",e.target.value)}>
            <option value="">Select geography…</option>{GEOGRAPHIES.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
        </Field>
      </div>
      <div style={S.grid2}>
        <Field label="Brand Positioning" hint="Describe how this organisation positions itself in the market" fieldKey="brandPositioning"><textarea style={S.textarea} value={form.brandPositioning} placeholder="e.g. Premium full-service bank with a focus on business customers" onChange={e=>update("brandPositioning",e.target.value)}/></Field>
        <Field label="Competitive Set & Differentiation" hint="List key competitors and describe what differentiates this organisation" fieldKey="competitiveSet"><textarea style={S.textarea} value={form.competitiveSet} placeholder="e.g. Competes with Big 4 banks; differentiates on business banking depth" onChange={e=>update("competitiveSet",e.target.value)}/></Field>
      </div>
      <div style={S.grid2}>
        <Field label="Regulatory & Operational Context" hint="Identify regulatory obligations or operational constraints" fieldKey="regulatoryContext"><textarea style={S.textarea} value={form.regulatoryContext} placeholder="e.g. APRA-regulated; subject to CDR and open banking obligations" onChange={e=>update("regulatoryContext",e.target.value)}/></Field>

      </div>

    </div>
  );
}

function StepGeneric({fields,form,update,sectionId}){
  return(
    <div>
      {fields.map((row,i)=>(
        <div key={i} style={S.grid2}>
          {row.map(f=>(
            <Field key={f.key} label={f.label} hint={f.hint} fieldKey={f.key}>
              <textarea style={S.textarea} value={form[f.key]} placeholder={f.placeholder} onChange={e=>update(f.key,e.target.value)}/>
            </Field>
          ))}
        </div>
      ))}
      <FileDrop sectionId={sectionId}/>
    </div>
  );
}

// ── CHANNEL VOLUME TABLE ──────────────────────────────────────────────────────
const CHANNEL_ROWS=[
  {key:"volMobileApp",label:"Mobile App"},
  {key:"volWebsite",label:"Website / Online Portal"},
  {key:"volChatbot",label:"Chatbot / Virtual Assistant"},
  {key:"volEmail",label:"Email"},
  {key:"volCallCentre",label:"Call Centre / Phone"},
  {key:"volLiveChat",label:"Live Chat (Agent-Assisted)"},
  {key:"volBranch",label:"Branch / Store"},
  {key:"volAgent",label:"Field Agent / Broker"},
  {key:"volOther",label:"Other"},
];

function ChannelVolumeTable({form,update}){
  const colStyle=(align)=>({padding:"8px 10px",fontSize:"12px",color:"#CCCCCC",textAlign:align||"left",borderBottom:"1px solid #1E2E15"});
  const hStyle={padding:"8px 10px",fontSize:"11px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.5px",background:"#0B0F0A",textAlign:"center"};
  const inpStyle={width:"100%",background:"transparent",border:"none",borderBottom:"1px solid #2A3E20",color:"#FFFFFF",fontSize:"12px",padding:"4px 6px",outline:"none",textAlign:"center",fontFamily:"inherit"};
  const totalDigital=(
    (parseFloat(form.volMobileApp)||0)+
    (parseFloat(form.volWebsite)||0)+
    (parseFloat(form.volChatbot)||0)+
    (parseFloat(form.volEmail)||0)
  ).toFixed(0);
  const totalAssisted=(
    (parseFloat(form.volCallCentre)||0)+
    (parseFloat(form.volLiveChat)||0)
  ).toFixed(0);
  const totalInPerson=(
    (parseFloat(form.volBranch)||0)+
    (parseFloat(form.volAgent)||0)+
    (parseFloat(form.volOther)||0)
  ).toFixed(0);
  const grand=((parseFloat(totalDigital)||0)+(parseFloat(totalAssisted)||0)+(parseFloat(totalInPerson)||0)).toFixed(0);
  const pct=(n)=>grand>0?((parseFloat(n)/parseFloat(grand))*100).toFixed(0)+"%" :"—";

  const groupLabel=(label,color)=>(
    <tr>
      <td colSpan={5} style={{padding:"10px 10px 4px",fontSize:"10px",fontWeight:"700",color:color,textTransform:"uppercase",letterSpacing:"0.8px",background:"rgba(0,0,0,0.2)",borderBottom:"1px solid #1E2E15"}}>{label}</td>
    </tr>
  );

  const renderRow=(r)=>(
    <tr key={r.key} style={{borderBottom:"1px solid #1A2A12"}}>
      <td style={colStyle()}>{r.label}</td>
      <td style={{...colStyle("center")}}><input style={inpStyle} value={form[r.key]||""} placeholder="—" onChange={e=>update(r.key,e.target.value)}/></td>
      <td style={{...colStyle("center")}}><input style={inpStyle} value={form[r.key+"_unit"]||""} placeholder="e.g. /month" onChange={e=>update(r.key+"_unit",e.target.value)}/></td>
      <td style={{...colStyle("center")}}><input style={inpStyle} value={form[r.key+"_trend"]||""} placeholder="▲ / ▼ / →" onChange={e=>update(r.key+"_trend",e.target.value)}/></td>
      <td style={{...colStyle("center")}}><input style={inpStyle} value={form[r.key+"_notes"]||""} placeholder="Optional note" onChange={e=>update(r.key+"_notes",e.target.value)}/></td>
    </tr>
  );

  return(
    <div style={{marginBottom:"1.5rem"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
        <div>
          <label style={S.label}>Channel & Interaction Volume</label>
          <p style={S.hint}>Enter current interaction volumes across digital, assisted and in-person channels. Use consistent units (e.g. monthly contacts, annual transactions).</p>
        </div>
      </div>

      {/* Summary totals */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"10px",marginBottom:"14px"}}>
        {[
          {label:"Digital",val:totalDigital,color:"#86BC25",sub:"App · Web · Chatbot · Email"},
          {label:"Assisted",val:totalAssisted,color:"#3B82F6",sub:"Call Centre · Live Chat"},
          {label:"In Person",val:totalInPerson,color:"#F59E0B",sub:"Branch · Agent · Other"},
          {label:"Total",val:grand,color:"#CCCCCC",sub:"All channels combined"},
        ].map(b=>(
          <div key={b.label} style={{background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"10px",padding:"12px 14px",borderTop:`3px solid ${b.color}`}}>
            <div style={{fontSize:"10px",fontWeight:"700",color:b.color,textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"4px"}}>{b.label}</div>
            <div style={{fontSize:"22px",fontWeight:"800",color:"#FFFFFF",lineHeight:1}}>{b.val>0?b.val:"—"}</div>
            <div style={{fontSize:"10px",color:"#555",marginTop:"4px"}}>{b.sub}</div>
            {b.val>0&&b.label!=="Total"&&<div style={{fontSize:"11px",color:b.color,marginTop:"4px"}}>{pct(b.val)} of total</div>}
          </div>
        ))}
      </div>

      {/* Volume table */}
      <div style={{background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"12px",overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:"#121A0D"}}>
              <th style={{...hStyle,textAlign:"left",width:"22%"}}>Channel</th>
              <th style={{...hStyle,width:"16%"}}>Volume</th>
              <th style={{...hStyle,width:"16%"}}>Unit / Period</th>
              <th style={{...hStyle,width:"14%"}}>Trend</th>
              <th style={{...hStyle,width:"32%"}}>Notes</th>
            </tr>
          </thead>
          <tbody>
            {groupLabel("🖥 Digital","#86BC25")}
            {renderRow(CHANNEL_ROWS[0])}
            {renderRow(CHANNEL_ROWS[1])}
            {renderRow(CHANNEL_ROWS[2])}
            {renderRow(CHANNEL_ROWS[3])}
            {groupLabel("📞 Assisted","#3B82F6")}
            {renderRow(CHANNEL_ROWS[4])}
            {renderRow(CHANNEL_ROWS[5])}
            {groupLabel("🏢 In Person / Other","#F59E0B")}
            {renderRow(CHANNEL_ROWS[6])}
            {renderRow(CHANNEL_ROWS[7])}
            {renderRow(CHANNEL_ROWS[8])}
          </tbody>
        </table>
      </div>
      <p style={{fontSize:"11px",color:"#444",marginTop:"8px"}}>Tip: Consistent units make the mix comparable — e.g. all in monthly interactions, or all in annual transactions.</p>
    </div>
  );
}

function Step7({form,update}){
  const sliders=[{key:"readinessData",label:"Data Readiness",hint:"How ready is the data infrastructure to support agentic decisioning?"},{key:"readinessTech",label:"Technology Readiness",hint:"How mature is the tech stack for agentic integration and API exposure?"},{key:"readinessOrg",label:"Organisational Readiness",hint:"How prepared is the organisation culturally for agentic transformation?"},{key:"readinessStrategy",label:"Strategic Readiness",hint:"How clear and committed is the leadership team to an agentic strategy?"},{key:"readinessCustomer",label:"Customer Readiness",hint:"How ready are customers to engage with or delegate to AI agents?"}];
  const avg=(sliders.reduce((s,sl)=>s+(+form[sl.key]||3),0)/sliders.length).toFixed(1);
  const scoreColor=avg>=4?"#66CC00":avg>=3?"#86BC25":avg>=2?"#F59E0B":"#EF4444";
  return(
    <div>
      <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
        <div style={{fontSize:"56px",fontWeight:"800",color:scoreColor,lineHeight:1}}>{avg}</div>
        <div style={{fontSize:"14px",color:"#888",marginTop:"4px"}}>Overall Readiness Score / 5</div>
        <div style={{height:"6px",background:"#1E2E15",borderRadius:"4px",marginTop:"12px",maxWidth:"300px",margin:"12px auto 0"}}>
          <div style={{height:"100%",width:`${(avg/5)*100}%`,background:scoreColor,borderRadius:"4px",transition:"width 0.4s"}}/>
        </div>
      </div>
      <div style={{...S.card,marginBottom:"1.5rem"}}>{sliders.map(sl=><ReadinessSlider key={sl.key} label={sl.label} hint={sl.hint} value={form[sl.key]} onChange={v=>update(sl.key,v)}/>)}</div>
      <div style={S.grid2}>
        <Field label="Key Assumptions" hint="List assumptions underpinning this strategy that require validation" fieldKey="keyAssumptions"><textarea style={S.textarea} value={form.keyAssumptions} placeholder="e.g. Customers will delegate routine financial decisions to agents within 3 years" onChange={e=>update("keyAssumptions",e.target.value)}/></Field>
        <Field label="Open Questions" hint="Key questions that remain unanswered and require further discovery" fieldKey="openQuestions"><textarea style={S.textarea} value={form.openQuestions} placeholder="e.g. Which agent platforms will customers prefer?" onChange={e=>update("openQuestions",e.target.value)}/></Field>
      </div>
      <FileDrop sectionId="step7"/>
    </div>
  );
}

const READABILITY_LEVELS=["Not available","Unstructured / PDF only","Partially structured","Well-structured","Machine-readable / API-ready"];
const READABILITY_COLORS=["#EF4444","#F59E0B","#F59E0B","#86BC25","#66CC00"];
const RISK_COLORS={Critical:"#EF4444",High:"#F97316",Medium:"#F59E0B",Low:"#86BC25"};

// ── STEP 8: AGENT VISIBILITY ASSESSMENT ──────────────────────────────────────
function Step8({form,update}){
  const industry=form.industry||"";
  const cats=(INDUSTRY_DATA_CATEGORIES[industry]||DEFAULT_CATEGORIES);
  const competitors=(form.competitiveSet||"").split(/[,;]/).map(s=>s.trim()).filter(Boolean).slice(0,5);
  const client=form.clientName||"Client";

  const[ratings,setRatings]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("asa_vis_ratings")||"{}");}catch{return{};}
  });
  const[notes,setNotes]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("asa_vis_notes")||"{}");}catch{return{};}
  });
  const[aiResult,setAiResult]=useState(()=>{
    try{const r=localStorage.getItem("asa_vis_result");return r?JSON.parse(r):null;}catch{return null;}
  });
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);

  const setRating=(cat,val)=>{
    const next={...ratings,[cat]:val};
    setRatings(next);
    localStorage.setItem("asa_vis_ratings",JSON.stringify(next));
    update("visibilityRatings",JSON.stringify(next));
  };
  const setNote=(cat,val)=>{
    const next={...notes,[cat]:val};
    setNotes(next);
    localStorage.setItem("asa_vis_notes",JSON.stringify(next));
    update("visibilityNotes",JSON.stringify(next));
  };

  const overallScore=cats.length>0
    ?Math.round(cats.reduce((s,c)=>s+(ratings[c]||0),0)/cats.length*10)/10
    :0;
  const overallColor=overallScore>=3.5?"#66CC00":overallScore>=2.5?"#86BC25":overallScore>=1.5?"#F59E0B":"#EF4444";

  const runAssessment=async()=>{
    setLoading(true);setError(null);
    const ratingSummary=cats.map(c=>`- ${c}: ${READABILITY_LEVELS[ratings[c]||0]} (${ratings[c]||0}/4)${notes[c]?` — ${notes[c]}`:"" }`).join("\n");
    const prompt=`You are an expert agentic commerce strategist at Deloitte. Analyse the machine-readability and agent-visibility position of ${client} (${industry}, ${form.geography||"Australia"}) and produce a structured assessment.

CLIENT CONTEXT:
- Client: ${client}
- Industry: ${industry}
- Brand positioning: ${form.brandPositioning||"Not provided"}
- Competitive set: ${form.competitiveSet||"Not provided"}
- Key propositions: ${form.currentPropositions||"Not provided"}

MACHINE-READABILITY SELF-ASSESSMENT (0=Not available, 1=Unstructured/PDF, 2=Partially structured, 3=Well-structured, 4=Machine-readable/API-ready):
${ratingSummary}

NAMED COMPETITORS TO ANALYSE: ${competitors.length>0?competitors.join(", "):"Key industry competitors"}

Respond ONLY with a valid JSON object — no markdown, no preamble, no trailing text — with exactly this structure:
{
  "overallRating": "string — one sentence verdict on ${client}'s overall machine-readability position",
  "agentReadinessScore": number between 0-100,
  "strengthAreas": ["array of 2-3 data categories where ${client} is reasonably well-positioned"],
  "criticalGaps": [
    {
      "category": "data category name",
      "issue": "specific gap or problem — 1-2 sentences",
      "agentImpact": "how this hurts ${client} when an agent evaluates this category",
      "urgency": "Critical|High|Medium|Low"
    }
  ],
  "invisibilityRisks": [
    {
      "scenario": "specific agent query or decision scenario",
      "whyInvisible": "why ${client} would be disadvantaged or absent from agent responses",
      "competitorAdvantage": "which named competitor(s) from [${competitors.join(", ")||"key competitors"}] are better positioned and why",
      "valueAtRisk": "qualitative estimate of what ${client} stands to lose",
      "riskLevel": "Critical|High|Medium|Low"
    }
  ],
  "quickWins": ["array of 3-4 specific, actionable improvements ${client} could make in 0-90 days to improve agent visibility"],
  "strategicImperative": "2-3 sentence strategic conclusion about what ${client} must prioritise to avoid being invisible on agent channels"
}`;

    try{
      const _hdrs={"Content-Type":"application/json"};
      const _key=localStorage.getItem("asa_api_key")||"";
      if(_key)_hdrs["x-api-key"]=_key;
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:_hdrs,
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
      });
      const data=await res.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"";
      const clean=text.replace(/```json|```/g,"").trim();
      const parsed=JSON.parse(clean);
      setAiResult(parsed);
      localStorage.setItem("asa_vis_result",JSON.stringify(parsed));
      update("visibilityAssessment",JSON.stringify(parsed));
    }catch(e){
      setError("Assessment failed — check your API connection and try again.");
      console.error(e);
    }
    setLoading(false);
  };

  const resetAssessment=()=>{
    setAiResult(null);setError(null);
    localStorage.removeItem("asa_vis_result");
    update("visibilityAssessment","");
  };

  return(
    <div>
      {/* Intro */}
      <div style={{...S.card,marginBottom:"1.25rem",background:"rgba(134,188,37,0.05)",border:"1px solid rgba(134,188,37,0.2)"}}>
        <p style={{margin:"0 0 6px",fontSize:"14px",color:"#CCCCCC",lineHeight:"1.6"}}>Rate how machine-readable {client}'s key data categories are today — from not available through to API-ready. Claude will then identify where {client} risks becoming invisible on agent channels, and where <strong style={{color:"#FFFFFF"}}>{competitors.length>0?competitors.join(", "):"your named competitors"}</strong> are better positioned.</p>
        <p style={{margin:0,fontSize:"12px",color:"#666"}}>Industry: {industry||"Set in Step 1"} · Competitors pulled from Step 1 · {cats.length} data categories to assess</p>
      </div>

      {/* Overall score bar */}
      <div style={{display:"flex",alignItems:"center",gap:"16px",marginBottom:"1.25rem",background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"12px",padding:"14px 18px"}}>
        <div style={{textAlign:"center",minWidth:"60px"}}>
          <div style={{fontSize:"32px",fontWeight:"800",color:overallColor,lineHeight:1}}>{overallScore.toFixed(1)}</div>
          <div style={{fontSize:"10px",color:"#555",marginTop:"2px"}}>avg / 4</div>
        </div>
        <div style={{flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:"#FFFFFF"}}>Machine-Readability Score</span>
            <span style={{fontSize:"11px",color:overallColor}}>{overallScore>=3.5?"API-Ready":overallScore>=2.5?"Well-Structured":overallScore>=1.5?"Partially Structured":overallScore>0?"Mostly Unstructured":"Not Yet Rated"}</span>
          </div>
          <div style={{height:"8px",background:"#1E2E15",borderRadius:"4px"}}>
            <div style={{height:"100%",width:`${(overallScore/4)*100}%`,background:overallColor,borderRadius:"4px",transition:"width 0.4s"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"9px",color:"#444",marginTop:"3px"}}>
            <span>0 — Not available</span><span>4 — API-ready</span>
          </div>
        </div>
      </div>

      {/* Rating table */}
      <div style={{background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"12px",overflow:"hidden",marginBottom:"1.25rem"}}>
        <div style={{padding:"12px 16px",background:"#121A0D",borderBottom:"1px solid #1E2E15",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:"12px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.5px"}}>Data Category Assessment</span>
          <div style={{display:"flex",gap:"8px"}}>
            {READABILITY_LEVELS.map((l,i)=>(
              <span key={i} style={{fontSize:"10px",color:READABILITY_COLORS[i],background:"rgba(0,0,0,0.3)",padding:"2px 7px",borderRadius:"4px"}}>{i} — {l.split(" ")[0]}</span>
            ))}
          </div>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:"#0D1509"}}>
              <th style={{padding:"8px 14px",fontSize:"11px",fontWeight:"700",color:"#555",textAlign:"left",width:"32%"}}>Data Category</th>
              <th style={{padding:"8px 14px",fontSize:"11px",fontWeight:"700",color:"#555",textAlign:"center",width:"44%"}}>Machine-Readability Level</th>
              <th style={{padding:"8px 14px",fontSize:"11px",fontWeight:"700",color:"#555",textAlign:"left",width:"24%"}}>Notes</th>
            </tr>
          </thead>
          <tbody>
            {cats.map((cat,ci)=>{
              const r=ratings[cat]||0;
              const col=READABILITY_COLORS[r];
              return(
                <tr key={ci} style={{borderBottom:"1px solid #0F1E0C",background:ci%2===0?"transparent":"rgba(0,0,0,0.15)"}}>
                  <td style={{padding:"10px 14px",fontSize:"13px",color:"#CCCCCC",verticalAlign:"middle"}}>{cat}</td>
                  <td style={{padding:"8px 14px",verticalAlign:"middle"}}>
                    <div style={{display:"flex",gap:"4px",justifyContent:"center"}}>
                      {READABILITY_LEVELS.map((label,li)=>(
                        <button key={li} onClick={()=>setRating(cat,li)}
                          title={label}
                          style={{padding:"5px 10px",borderRadius:"6px",fontSize:"11px",fontWeight:r===li?"700":"400",cursor:"pointer",border:"none",background:r===li?READABILITY_COLORS[li]:"#1A2A12",color:r===li?"#0B0F0A":r>li?READABILITY_COLORS[li]:"#444",transition:"all 0.15s",whiteSpace:"nowrap"}}>
                          {li}
                        </button>
                      ))}
                    </div>
                    <div style={{textAlign:"center",fontSize:"10px",color:col,marginTop:"3px"}}>{READABILITY_LEVELS[r]}</div>
                  </td>
                  <td style={{padding:"8px 14px",verticalAlign:"middle"}}>
                    <input style={{...S.input,fontSize:"11px",padding:"5px 8px",minHeight:"unset"}} value={notes[cat]||""} placeholder="Optional note…" onChange={e=>setNote(cat,e.target.value)}/>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Run Assessment button */}
      {!aiResult&&(
        <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
          <button onClick={runAssessment} disabled={loading||overallScore===0}
            style={{...S.btnPrimary,fontSize:"15px",padding:"14px 36px",borderRadius:"12px",opacity:(loading||overallScore===0)?0.6:1,display:"inline-flex",alignItems:"center",gap:"10px"}}>
            {loading?<><span style={{width:"16px",height:"16px",border:"2px solid rgba(0,0,0,0.3)",borderTopColor:"#0B0F0A",borderRadius:"50%",animation:"spin 0.7s linear infinite",display:"inline-block"}}/><span>Running AI Assessment…</span></>:<><span>🔍</span><span>Run Agent Visibility Assessment</span></>}
          </button>
          {overallScore===0&&<p style={{fontSize:"12px",color:"#555",marginTop:"8px"}}>Rate at least one data category above to run the assessment</p>}
          {competitors.length===0&&<p style={{fontSize:"12px",color:"#F59E0B",marginTop:"6px"}}>⚠ Add competitors in Step 1 to get named competitor analysis</p>}
          {error&&<p style={{fontSize:"13px",color:"#EF4444",marginTop:"10px"}}>{error}</p>}
        </div>
      )}

      {/* AI Results */}
      {aiResult&&(
        <div>
          {/* Header bar */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem"}}>
            <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
              <div style={{background:"rgba(134,188,37,0.1)",border:"1px solid #86BC25",borderRadius:"8px",padding:"4px 12px",fontSize:"11px",color:"#86BC25",fontWeight:"700",letterSpacing:"0.5px"}}>AI ASSESSMENT COMPLETE</div>
              <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                <div style={{width:"36px",height:"36px",borderRadius:"50%",background:aiResult.agentReadinessScore>=70?"#1E3A0A":aiResult.agentReadinessScore>=45?"#3A2A0A":"#3A0A0A",border:`2px solid ${aiResult.agentReadinessScore>=70?"#86BC25":aiResult.agentReadinessScore>=45?"#F59E0B":"#EF4444"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"800",color:aiResult.agentReadinessScore>=70?"#86BC25":aiResult.agentReadinessScore>=45?"#F59E0B":"#EF4444"}}>{aiResult.agentReadinessScore}</div>
                <span style={{fontSize:"11px",color:"#666"}}>Agent Readiness Score / 100</span>
              </div>
            </div>
            <button onClick={resetAssessment} style={{...S.btnSecondary,fontSize:"12px",padding:"6px 14px"}}>↺ Re-run</button>
          </div>

          {/* Overall verdict */}
          <div style={{...S.card,marginBottom:"1rem",borderLeft:"3px solid #86BC25"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"6px"}}>Overall Position</div>
            <p style={{margin:0,fontSize:"14px",color:"#CCCCCC",lineHeight:"1.7"}}>{aiResult.overallRating}</p>
          </div>

          {/* Strength areas */}
          <div style={{marginBottom:"1rem"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"8px"}}>✓ Relative Strengths</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
              {(aiResult.strengthAreas||[]).map((s,i)=>(
                <span key={i} style={{background:"rgba(134,188,37,0.1)",border:"1px solid rgba(134,188,37,0.3)",borderRadius:"8px",padding:"5px 12px",fontSize:"12px",color:"#86BC25"}}>{s}</span>
              ))}
            </div>
          </div>

          {/* Critical gaps */}
          <div style={{marginBottom:"1rem"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#F59E0B",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"8px"}}>⚠ Critical Data Gaps</div>
            {(aiResult.criticalGaps||[]).map((g,i)=>(
              <div key={i} style={{background:"#0B0F0A",border:"1px solid #1E2E15",borderRadius:"10px",padding:"12px 14px",marginBottom:"8px",borderLeft:`3px solid ${RISK_COLORS[g.urgency]||"#F59E0B"}`}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}}>
                  <span style={{fontSize:"13px",fontWeight:"700",color:"#FFFFFF"}}>{g.category}</span>
                  <span style={{fontSize:"10px",fontWeight:"700",color:RISK_COLORS[g.urgency]||"#F59E0B",background:`${RISK_COLORS[g.urgency]}18`,padding:"2px 8px",borderRadius:"4px"}}>{g.urgency}</span>
                </div>
                <p style={{margin:"0 0 4px",fontSize:"13px",color:"#CCCCCC",lineHeight:"1.5"}}>{g.issue}</p>
                <p style={{margin:0,fontSize:"12px",color:"#888",lineHeight:"1.4"}}><span style={{color:"#F59E0B"}}>Agent impact:</span> {g.agentImpact}</p>
              </div>
            ))}
          </div>

          {/* Invisibility risks */}
          <div style={{marginBottom:"1rem"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#EF4444",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"8px"}}>🚫 Invisibility Risks vs Competitors</div>
            {(aiResult.invisibilityRisks||[]).map((r,i)=>(
              <div key={i} style={{background:"#0B0F0A",border:`1px solid ${RISK_COLORS[r.riskLevel]||"#EF4444"}30`,borderRadius:"12px",padding:"14px 16px",marginBottom:"10px",position:"relative"}}>
                <div style={{position:"absolute",top:"14px",right:"14px"}}>
                  <span style={{fontSize:"10px",fontWeight:"700",color:RISK_COLORS[r.riskLevel]||"#EF4444",background:`${RISK_COLORS[r.riskLevel]}18`,padding:"3px 9px",borderRadius:"4px",border:`1px solid ${RISK_COLORS[r.riskLevel]}40`}}>{r.riskLevel} RISK</span>
                </div>
                <div style={{fontSize:"14px",fontWeight:"700",color:"#FFFFFF",marginBottom:"8px",paddingRight:"90px"}}>"{r.scenario}"</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"8px"}}>
                  <div>
                    <div style={{fontSize:"10px",fontWeight:"700",color:"#EF4444",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:"3px"}}>Why {client} is invisible</div>
                    <p style={{margin:0,fontSize:"12px",color:"#CCCCCC",lineHeight:"1.5"}}>{r.whyInvisible}</p>
                  </div>
                  <div>
                    <div style={{fontSize:"10px",fontWeight:"700",color:"#F59E0B",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:"3px"}}>Competitor advantage</div>
                    <p style={{margin:0,fontSize:"12px",color:"#CCCCCC",lineHeight:"1.5"}}>{r.competitorAdvantage}</p>
                  </div>
                </div>
                <div style={{borderTop:"1px solid #1E2E15",paddingTop:"8px",display:"flex",alignItems:"center",gap:"6px"}}>
                  <span style={{fontSize:"10px",color:"#555",fontWeight:"600",textTransform:"uppercase"}}>Value at risk:</span>
                  <span style={{fontSize:"12px",color:"#888"}}>{r.valueAtRisk}</span>
                </div>
              </div>
            ))}
          </div>

          {/* Quick wins */}
          <div style={{...S.card,marginBottom:"1rem",borderTop:"3px solid #86BC25"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"10px"}}>⚡ Quick Wins (0–90 days)</div>
            <ol style={{paddingLeft:"18px",margin:0}}>
              {(aiResult.quickWins||[]).map((w,i)=>(
                <li key={i} style={{fontSize:"13px",color:"#CCCCCC",lineHeight:"1.6",marginBottom:"6px"}}>{w}</li>
              ))}
            </ol>
          </div>

          {/* Strategic imperative */}
          <div style={{background:"rgba(134,188,37,0.05)",border:"1px solid rgba(134,188,37,0.25)",borderRadius:"12px",padding:"16px 18px"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:"#86BC25",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"8px"}}>Strategic Imperative</div>
            <p style={{margin:0,fontSize:"14px",color:"#FFFFFF",lineHeight:"1.7",fontStyle:"italic"}}>{aiResult.strategicImperative}</p>
          </div>
        </div>
      )}
    </div>
  );
}


function buildStrategyContent(form){
  const client=form.clientName||"the client organisation";
  const industry=form.industry||"the relevant sector";
  const geo=form.geography||"their market";
  const avg=((+form.readinessData+(+form.readinessTech)+(+form.readinessOrg)+(+form.readinessStrategy)+(+form.readinessCustomer))/5).toFixed(1);
  return{
    execSummary:{
      whatChanges:`When customers in the ${industry} sector delegate decisions to AI agents, the fundamental dynamic shifts from brand-to-customer relationships to brand-to-agent-to-customer architectures. ${client}'s products and services will increasingly be discovered, evaluated, and transacted by autonomous agents acting on behalf of customers — not by customers themselves. Trust, discoverability, and machine-readability of propositions become the new competitive battleground.`,
      atStake:`For ${client}, operating in ${geo} ${industry}, the stakes are material. The organisation faces margin compression from agent-driven comparison and switching, disintermediation risk in key customer journeys, and potential loss of the direct customer relationship that underpins long-term loyalty and cross-sell economics.`,
      topActions:[`Establish an Agentic Customer Centre of Excellence within 90 days to coordinate strategy, monitor agent ecosystem developments, and own the 12-month delivery roadmap`,`Audit and redesign core propositions for machine-readability, comparability, and agent discoverability`,`Build or partner to expose public product APIs that enable agent platforms to access, compare, and transact ${client} products`,`Identify and protect the 2–3 human moments that drive trust and loyalty — ensure these remain high-quality human-led interactions`,`Run a customer research sprint to understand willingness to delegate and trust posture across key segments`],
    },
    vision:{
      visionStatement:`${client} will win in the agentic economy by becoming the most trusted, most discoverable, and most agent-compatible organisation in ${industry} across ${geo} — delivering value whether customers engage directly or through AI agents acting on their behalf.`,
      posture:+avg>=4?"Lead":+avg>=3?"Adapt & Build":"Defend & Adapt",
      postureRationale:`With an overall readiness score of ${avg}/5, ${client} is positioned to ${+avg>=4?"take a leadership position and actively shape how the agentic economy develops in this category":+avg>=3?"move with urgency to adapt core propositions and build foundational agentic capability before the window closes":"prioritise defence of existing revenue and customer relationships while building the foundation for future agentic participation"}.`,
      disruptiveForces:[`Rise of AI-native consumer and business platforms acting as intermediaries between ${client} and its customers`,`Structural shift in discovery — from traditional search to agent-mediated recommendations — fundamentally changing how ${client}'s propositions are found`,`Regulatory evolution around agent-executed transactions, consent frameworks, and liability`,`Competitive pressure from digital-first challengers building agent-compatible products from the ground up`,`Customer expectation creep — as agent capabilities mature in adjacent categories, tolerance for friction in ${industry} will decline rapidly`],
      personas:[{name:"The Efficiency Maximiser",goal:"Minimise time and cognitive load on routine decisions",triggers:"High task frequency; clear comparison criteria; low emotional stakes",riskTolerance:"Medium — trusts agents for routine optimisation; requires oversight on significant commitments",switching:"Highly likely to switch if an agent identifies a materially better option with low friction"},{name:"The Trust-First Delegator",goal:"Access expert guidance without navigating complexity themselves",triggers:"Complexity; time pressure; trusted agent platform endorsement",riskTolerance:"Low — will delegate only to agents endorsed by trusted institutions",switching:"Moderate — brand trust creates inertia but will switch if agent identifies clear value gap"},{name:"The Hybrid Pragmatist",goal:"Use agents for research and shortlisting; retain human involvement for final decisions",triggers:"Milestone moments — major purchases, renewals, life events",riskTolerance:"Low for full delegation; high for agent-assisted research",switching:"Moderate — values agent efficiency but maintains human validation step"},{name:"The Sceptical Traditionalist",goal:"Maintain control and direct relationship with service providers",triggers:"May delegate only when trusted providers explicitly enable it",riskTolerance:"Very low — high concern about data privacy, errors, and accountability",switching:"Low — strong brand loyalty; agent interaction must be provider-initiated"}],
      delegationHeatmap:[{journey:"Product comparison & shortlisting",agentLikely:"High",humanLed:"Low",hybrid:"Agent shortlists, human selects"},{journey:(form.keyJourneys||"Renewal & switching").split(";")[0].trim(),agentLikely:"High",humanLed:"Low",hybrid:"Agent triggers, human confirms"},{journey:"Routine servicing & queries",agentLikely:"Very High",humanLed:"Minimal",hybrid:"Escalation for complaints"},{journey:"Complex advice & major commitments",agentLikely:"Low",humanLed:"High",hybrid:"Agent prepares, human advises"},{journey:(form.humanMoments||"Crisis & hardship moments").split(";")[0].trim(),agentLikely:"Very Low",humanLed:"Critical",hybrid:"Agent supports, human leads"}],
    },
    propositions:{
      exposureRisks:[`${form.propositionGaps||"Current propositions"} — complex terms and opaque pricing make machine-comparison difficult`,`Lack of public APIs means agents cannot access or transact ${client} products at the moment of customer decision`,`Loyalty and bundling benefits that depend on direct customer engagement may be invisible to agents optimising on a single dimension`,`Secondary products are at high risk of commoditisation through agent-driven comparison`],
      designPrinciples:["Machine-readable: All pricing, terms, and eligibility criteria must be structured for agent consumption","Comparable by design: Propositions must enable fair, accurate comparison across competitor products","Trust-signalled: Build explicit trust signals that agents can surface to customers","Actionable by API: Core transactions must be executable through secure, public APIs","Personalisation-ready: Propositions must support dynamic personalisation based on agent-provided context"],
      newPropositions:[{name:"Agent-First Product Tier",persona:"Efficiency Maximiser",valueLogic:"Optimised for machine comparison — transparent pricing, clear eligibility, instant decisioning API",differentiation:`First in ${industry} category to publish a dedicated agent-optimised product catalogue`,split:"90% agent-transacted / 10% human confirmation"},{name:(form.newPropositions||"Proactive Agentic Alert Service").split(";")[0].trim(),persona:"Trust-First Delegator",valueLogic:`Push-based proposition where ${client}'s own agent proactively identifies customer optimisation opportunities`,differentiation:`Inverts the agent dynamic — ${client} becomes the agent rather than waiting to be selected`,split:"70% automated / 30% customer review"},{name:"Hybrid Advice Companion",persona:"Hybrid Pragmatist",valueLogic:"Agent-assisted research and recommendation with seamless human handoff for complex decisions",differentiation:"Best-in-class human+AI experience that neither pure digital nor traditional human-only can match",split:"60% agent-led / 40% human-advised"}],
    },
    channels:{
      volumeSummary:(()=>{
        const rows=CHANNEL_ROWS.map(r=>({label:r.label,vol:form[r.key]||"",unit:form[r.key+"_unit"]||"",trend:form[r.key+"_trend"]||"",notes:form[r.key+"_notes"]||""})).filter(r=>r.vol);
        const digital=(parseFloat(form.volMobileApp)||0)+(parseFloat(form.volWebsite)||0)+(parseFloat(form.volChatbot)||0)+(parseFloat(form.volEmail)||0);
        const assisted=(parseFloat(form.volCallCentre)||0)+(parseFloat(form.volLiveChat)||0);
        const inperson=(parseFloat(form.volBranch)||0)+(parseFloat(form.volAgent)||0)+(parseFloat(form.volOther)||0);
        const grand=digital+assisted+inperson;
        return{rows,digital,assisted,inperson,grand};
      })(),
      agentDominated:["Product discovery and comparison — agents will increasingly own the top of the funnel",`Routine enquiries currently handled by ${(form.currentChannels||"call centre").split(";")[0].trim()} — will shift to API/agent resolution`,"Renewal and policy/account management — high automation potential","Quote generation and eligibility checking"],
      humanRetained:[(form.humanMoments||"High-stakes financial advice conversations").split(";")[0].trim(),(form.humanMoments||";Complaint and hardship resolution").split(";")[1]?.trim()||"Complaint and hardship resolution","Relationship management for high-value customers","Complex or bespoke product structuring"],
      futureChannelMix:{increase:["Public API layer","Agent platform partnerships","Embedded finance integrations","Conversational AI for routine servicing"],atRisk:["Inbound call centre volume","Manual comparison/quote flows","Physical branch for transactional services"],newRequired:["Agent ecosystem participation framework","Webhook and event-driven notification infrastructure","Agent-specific trust and consent layer"]},
      priorityInvestments:[`1. Public Product API Gateway — enables agent platforms to access, compare, and transact ${client} products`,`2. Agent-Compatible Product Catalogue — restructure proposition data for machine consumption`,`3. Real-Time Decisioning Engine — enables instant eligibility and pricing responses required by agents`,`4. Human Escalation Framework — design the moments where agent-to-human handoff delivers greatest value`,`5. ${(form.channelInvestments||"Digital identity and consent infrastructure").split(";")[0].trim()}`],
    },
    operatingModel:{
      newCapabilities:["Agentic product and API management function — owns the agent-facing product catalogue","AI/ML decisioning capability — real-time personalisation, eligibility, and pricing for agent requests","Agent ecosystem partnerships team — manages relationships with agent platforms","Agentic experience design — specialist capability for agent-mediated interaction","Regulatory and trust governance for agentic operations"],
      upliftRequired:[`${(form.coreCapabilities||"Core product capability").split(";")[0].trim()} — requires API-enablement and machine-readable structuring`,`Data platform — ${(form.dataAssets||"customer data assets").split(";")[0].trim()} require real-time access layer`,`${(form.techStack||"Core technology platform").split(";")[0].trim()} — requires event-driven architecture and API gateway`,"Customer identity and consent management — must extend to cover agent-acted-on-behalf permissions"],
      priorityInvestments:{buildNow:["API gateway and product catalogue — the foundation of all agentic participation","Agentic CoE — governance, strategy, and coordination function","Agent ecosystem monitoring — track platform developments and competitive moves"],experiment:[`Proof-of-concept for ${client}'s own agent capability — proactive customer notifications`,"Agent platform partnership pilots — test integration economics and conversion","Customer research on delegation willingness and trust thresholds"],canWait:["Full agent-executed transaction capability — dependent on regulatory clarity","Proprietary agent platform build — partnership first, build later"]},
    },
    valueCapture:{
      valueAtRisk:[`Margin compression in ${(form.revenueDrivers||"core revenue streams").split(";")[0].trim()} — agent-driven comparison will intensify rate competition`,"Customer acquisition cost increase — agents create a new intermediary layer","Cross-sell and relationship revenue at risk as agents optimise on single dimensions",form.valueAtRisk||"Fee income at risk as agents automate decisions previously requiring human advice"],
      opportunities:[`API and data monetisation — new revenue from agent platform partnerships`,`Servicing cost reduction — ${form.agentEconomics||"automation of routine interactions could reduce cost-to-serve by 15–30%"}`,"Retention improvement — proactive agentic capability enables surfacing value before customers seek alternatives",`New customer acquisition — ${client}'s agent-compatible products become preferred by agent platforms`],
      scenarios:{low:`Low agent adoption (20–30% of decisions agent-influenced by 2027): Modest margin pressure; early API investment delivers outsized positioning advantage; ROI primarily from servicing cost reduction`,medium:`Medium adoption (40–60% agent-influenced): Significant shift in acquisition economics; organisations without agent infrastructure lose material market share`,high:`High adoption (60%+ agent-influenced): Category structure fundamentally changes; product discoverability becomes the primary competitive battleground`},
      businessModelChoice:form.businessModelOptions||`${client} should pursue a hybrid model: defend owned channels for high-trust, high-value customer moments while actively building agent compatibility for routine and commodity interactions.`,
    },
    roadmap:{
      now:["Establish Agentic Customer CoE with executive sponsorship","Complete proposition audit — identify agent-readiness gaps across core product portfolio","Map and prioritise 3–5 customer journeys for agentic redesign","Begin API gateway scoping and vendor evaluation","Commission customer research on delegation willingness and trust","Engage regulatory affairs team on agentic transaction frameworks"],
      next:[`Launch MVP product API — expose comparison data and eligibility checking`,`Redesign 2–3 core propositions for agent discoverability and machine-readability`,"Pilot agent platform partnership — test integration, measure conversion and economics","Build agent experience design playbook","Deploy real-time decisioning capability for agent-speed responses",`Resolve ${(form.capabilityGaps||"key capability gap").split(";")[0].trim()} through build or acquisition`],
      later:["Scale API platform to full product coverage with transactional capability",`Launch ${client}-owned proactive agent service for priority customer segments`,"Formalise agent ecosystem partnership framework — commercial terms, data agreements, trust standards","Embed agentic KPIs into business performance framework","Evaluate proprietary agent platform build vs. continued partnership"],
    },
    assumptions:{
      assumptions:[`Customer willingness to delegate in ${industry} will follow the pattern of early adopters in adjacent categories`,`Regulatory frameworks in ${geo} will evolve to permit agent-executed transactions within 12–18 months`,form.keyAssumptions||"The pace of AI agent platform adoption will justify investment in the 12–24 month horizon","Data assets are sufficient to support personalised agentic propositions with reasonable investment","Agent platforms will operate on a partnership model rather than pure aggregation/commoditisation"],
      risks:[`Regulatory delay or restriction on agent-executed transactions in ${geo}`,"Faster-than-expected competitor investment creating a first-mover disadvantage","Customer reluctance to delegate — cultural or trust barriers underestimated",`Technical debt in ${(form.techStack||"legacy systems").split(";")[0].trim()} creating longer API delivery timelines`,"Agent platform consolidation reducing negotiating leverage"],
      openQuestions:[form.openQuestions||"Which agent platforms will achieve dominant market share, and on what timeline?","What regulatory position will be taken on agent-executed transactions and liability?",`At what commercial terms will agent platforms integrate with ${client}'s products?`,"Which customer segments will delegate first, and what are the trust triggers in this category?"],
    },
    workshopPrompts:[`Which of ${client}'s current revenue streams is most exposed to agent-driven disruption in the next 24 months, and why?`,`If a leading agent platform offered to integrate ${client}'s products tomorrow — what would need to be true about commercial terms for you to say yes?`,"Where in the customer lifecycle does human interaction create irreplaceable value that agents cannot replicate?",`What would a 'defend the relationship' strategy look like for ${client} — and what investments would it require?`,`If ${client} were starting from scratch as a pure agentic business, what would it look like?`,`Which of ${client}'s capabilities — data, technology, brand, distribution — is the strongest foundation for building an agentic advantage?`,`What is the minimum viable agentic proposition ${client} could put to market in 90 days to begin learning?`,`How should ${client} think about pricing in a world where agents optimise aggressively for customer value?`],

function loadScript(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){resolve();return;}
    const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
  });
}
